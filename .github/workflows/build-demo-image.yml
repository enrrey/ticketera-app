name: Build demo image (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-demo-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require sandbox public configuration
        shell: bash
        run: |
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY; do
            if [[ "${!name}" != pk_test_* ]]; then echo "$name must use sandbox"; exit 1; fi
          done
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux image without AWS credentials
        shell: bash
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --file infra/aws-demo/Dockerfile \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY \
            --tag ticketera-demo:${{ github.sha }} --load .
      - name: Check container startup with synthetic private configuration
        shell: bash
        run: |
          docker run --detach --name ticketera-smoke --publish 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp:rw,size=128m \
            -e NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY -e NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY \
            -e CLERK_SECRET_KEY=sk_test_fixture -e STRIPE_SECRET_KEY=sk_test_fixture \
            -e QR_SIGNING_SECRET=$(printf 'a%.0s' {1..64}) \
            -e APP_URL=https://example.com -e DATABASE_URL=postgresql://demo:fixture@localhost/demo \
            ticketera-demo:${{ github.sha }}
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/window.svg >/dev/null; then ready=true; break; fi
            sleep 1
          done
          docker logs ticketera-smoke
          docker rm --force ticketera-smoke >/dev/null
          if [ "$ready" != true ]; then echo 'Container failed static readiness check'; exit 1; fi
      - name: Export image
        run: docker save ticketera-demo:${{ github.sha }} --output "$RUNNER_TEMP/ticketera-demo.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: ticketera-demo-image
          path: ${{ runner.temp }}/ticketera-demo.tar
          retention-days: 1
          compression-level: 6
