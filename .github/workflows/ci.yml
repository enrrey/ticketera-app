name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Syntactically valid fake Clerk public key for rendering; no account or secret.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run build

  deploy-demo:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEMO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment settings
        shell: bash
        run: |
          for name in AWS_REGION ECR_REPOSITORY FUNCTION_NAME AWS_ROLE_ARN; do
            if [ -z "${!name}" ]; then echo "Missing variable: $name"; exit 1; fi
          done
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY; do
            if [[ "${!name}" != pk_test_* ]]; then echo "$name must use sandbox"; exit 1; fi
          done
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Check existing demo bootstrap before building
        shell: bash
        run: |
          aws lambda get-alias --function-name "$FUNCTION_NAME" --name demo --query FunctionVersion --output text >/dev/null
          FUNCTION_URL=$(aws lambda get-function-url-config --function-name "$FUNCTION_NAME" --qualifier demo --query FunctionUrl --output text)
          echo "FUNCTION_URL=$FUNCTION_URL" >> "$GITHUB_ENV"
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Lambda image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --file infra/aws-demo/Dockerfile \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY \
            --tag "$IMAGE_URI" --push .
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
      - name: Publish and smoke-test version before switching demo alias
        shell: bash
        run: |
          NEW_VERSION=$(aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$IMAGE_URI" --publish --query Version --output text)
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          node -e 'const fs=require("node:fs");const host=new URL(process.env.FUNCTION_URL).host;fs.writeFileSync(process.env.RUNNER_TEMP+"/smoke-event.json",JSON.stringify({version:"2.0",routeKey:"$default",rawPath:"/api/health",rawQueryString:"",headers:{host},requestContext:{domainName:host,http:{method:"GET",path:"/api/health",protocol:"HTTP/1.1",sourceIp:"127.0.0.1",userAgent:"ticketera-ci"},requestId:"ci-smoke",routeKey:"$default",stage:"$default",timeEpoch:Date.now()},isBase64Encoded:false}));'
          INVOCATION_ERROR=$(aws lambda invoke --function-name "$FUNCTION_NAME" --qualifier "$NEW_VERSION" \
            --cli-binary-format raw-in-base64-out --payload "file://$RUNNER_TEMP/smoke-event.json" \
            --query FunctionError --output text "$RUNNER_TEMP/smoke-response.json")
          if [ "$INVOCATION_ERROR" != "None" ]; then echo "Lambda smoke invocation failed"; exit 1; fi
          node -e 'const body=JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP+"/smoke-response.json","utf8"));if(body.statusCode!==200)throw new Error("Health check failed; alias not changed");'
          aws lambda update-alias --function-name "$FUNCTION_NAME" --name demo --function-version "$NEW_VERSION" --query FunctionVersion --output text
